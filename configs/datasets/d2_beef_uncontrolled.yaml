# D2 — Beef-Uncontrolled. Environmental robustness.
#
# Acquired automatically; SHA-256 verified on download.
#
# Same protocol deviation as D1: no specimen identifier is published. `sl no`
# and `minutes` are both strictly increasing with zero resets (20815 rows over
# 1735 distinct minutes), so the file is one continuous measurement session.
# `specimen.source: time_block` is an assumption, not a published grouping, and
# results built on it are flagged non-compliant.

dataset_id: d2_beef_uncontrolled
display_name: "Beef-Uncontrolled (e-nose)"
role: "environmental robustness"

source:
  url: "https://data.mendeley.com/datasets/n8mc3nspfn/1"
  doi: "10.17632/n8mc3nspfn.1"
  version: "1"
  license: "CC BY 4.0"
  citation: >
    e-nose beef quality dataset (4 classes, TVC). Mendeley Data, V1.
    doi:10.17632/n8mc3nspfn.1

raw:
  file: beef_uncontrolled.csv
  strip_whitespace: true
  column_map:
    time_index: minutes
    freshness_class: class
    tvc: tvc
  features:
    - Mq-2
    - Mq-3
    - Mq-4
    - Mq-5
    - Mq-135
    - Mq-136
    - Mq-137
    - Mq-138
    - Temperature
    - Humidity
  class_label_map:
    "1": 0
    "2": 1
    "3": 2
    "4": 3

labels:
  class_names: [Excellent, Good, Acceptable, Spoiled]
  derivation: >
    The dataset publishes integer classes 1..4 without names. Verified that they
    partition TVC (log10 CFU/g) at the same 3/4/5 thresholds used by D1:
    class 1 tvc in [2.002, 2.988], class 2 [3.092, 3.999], class 3 [4.026,
    4.997], class 4 [5.100, 6.314]. The Excellent/Good/Acceptable/Spoiled names
    above are INFERRED from those thresholds and are not stated by the provider.
  independence_caveat: >
    Same as D1 — the class label is a threshold of TVC, so classification and
    regression are not independent evidence.

specimen:
  source: assumed_time_block
  block_by: time
  block_size: 150
  note: >
    ASSUMED, not published. 150 distinct `minutes` values per block (~12 rows
    each at the observed sampling rate), yielding ~12 blocks over the 1735
    distinct minutes. Assumption, not a real independent sample.

features:
  columns:
    - Mq-2
    - Mq-3
    - Mq-4
    - Mq-5
    - Mq-135
    - Mq-136
    - Mq-137
    - Mq-138
    - Temperature
    - Humidity

tasks: [classification, regression]

preprocessing_overrides: {}

notes: >
  Row 2827 carries Temperature = 0 and a simultaneous ~85-unit jump in Humidity,
  consistent with a sensor warm-up or logging discontinuity rather than a real
  ambient reading. It is retained (it is finite, so the loader keeps it) and is
  left visible rather than silently repaired; if it distorts results the fix is
  a documented preprocessing rule in a protocol amendment, not an ad-hoc edit.
