# D2 — Beef-Uncontrolled. Environmental robustness task.
#
# Binding (R0 rework, DATA-16): D2 = 10.17632/mwmhh766fc.3, version 3.
# The provider's own title is "Electronic nose dataset for beef quality
# monitoring under an uncontrolled environment" — which is why this DOI is D2
# and not D1. The previous revision of this file used version 1 (a single
# 4553-row session with no sample grouping) and concluded that no specimen-level
# split was possible. Version 3 publishes the same measurements as five series,
# one per beef cut, and the split problem disappears.
#
# ---------------------------------------------------------------------------
# WHY THIS DATASET IS THE COMPLIANT ONE
#
# The v3 archive contains TS1.csv .. TS5.csv, each 2160 rows covering 2160
# distinct minutes. The provider's description states the five series "correspond
# to five beef cuts", so the grouping is the provider's own, not an assumption
# this project invented. `specimen.source: series_file` records that provenance,
# and `split_unit: specimen` is satisfied by LOSO(5) with one cut held out at a
# time.
#
# WHAT THE GROUPING IS *NOT* (review item H1). "Five beef cuts" is all the
# provider says. It does not say whether the cuts come from the same animal,
# which primal they are, or whether they are independent biological samples.
# `specimen.group_semantics_verified` is therefore false, and LOSO(5) removes a
# source FILE at a time — a statement about the published structure, not about
# biology. No result on D2 may describe a fold difference as an individual or
# anatomical difference.
#
# AND THE FOLD IS CONFOUNDED WITH THE CAMPAIGN. The five files were not acquired
# together (see `acquisition_campaigns`): TS1 was recorded in May 2016 and
# TS2..TS5 nine days in October 2018. LOSO(5) therefore changes the cut AND the
# campaign in the same fold, and the two are not separable from the five
# published series. E1 must report leave-TS1-out and leave-{TS2..TS5}-out
# separately; a single pooled "cross-cut" number would silently read a 2.5-year
# instrument/protocol difference as a biological one.
#
# The five files do NOT share one column order: TS1 ends with
# `..., Humidity, Temperature` while TS2–TS5 end with `..., Temperature,
# Humidity`. Every column is therefore addressed by NAME through feature_map.
# Nothing in this project reads a column by position, and a unit test asserts it.
# ---------------------------------------------------------------------------

dataset_id: d2_beef_uncontrolled
display_name: "Beef-Uncontrolled (e-nose)"
role: "environmental robustness"

source:
  url: "https://data.mendeley.com/datasets/mwmhh766fc/3"
  doi: "10.17632/mwmhh766fc.3"
  version: "3"
  license: "CC BY 4.0"
  citation: >
    Wijaya, Dedy Rahman; Sarno, Riyanarto; Zulaika, Enny (2018). Electronic nose
    dataset for beef quality monitoring under an uncontrolled environment.
    Mendeley Data, V3. doi:10.17632/mwmhh766fc.3

raw:
  glob: "TS*.csv"
  glob_specimen_pattern: '^(?P<specimen>TS\d+)\.csv$'
  strip_whitespace: true
  column_map:
    time_index: minute
    freshness_class: class
    tvc: TVC
  features:
    - MQ2
    - MQ3
    - MQ4
    - MQ5
    - MQ6
    - MQ8
    - MQ9
    - MQ135
    - MQ136
    - temperature
    - humidity
  feature_map:
    MQ2: "MQ2"
    MQ3: "MQ3"
    MQ4: "MQ4"
    MQ5: "MQ5"
    MQ6: "MQ6"
    MQ8: "MQ8"
    MQ9: "MQ9"
    MQ135: "MQ135"
    MQ136: "MQ136"
    temperature: "Temperature"
    humidity: "Humidity"
  class_label_map:
    excellent: 0
    good: 1
    acceptable: 2
    spoiled: 3

labels:
  class_names: [Excellent, Good, Acceptable, Spoiled]
  naming_caveat: >
    These ARE provider-stated names: the `class` column ships the words
    excellent / good / acceptable / spoiled directly. D2 is the only dataset in
    the project whose four-level freshness names are the provider's own.
  derivation: >
    Verified against the downloaded v3 files that the four names partition TVC at
    the same 3 / 4 / 5 log10 CFU/g thresholds used elsewhere: excellent
    [2.233, 2.989], good [3.044, 3.847], acceptable [4.762, 5.000], spoiled
    [4.875, 5.098]. The names are the provider's; the thresholds describe them.
  independence_caveat: >
    Same as D1 — the class is a discretisation of TVC, so classification and
    regression are not independent evidence. Note also that v3's TVC range stops
    at ~5.10, so the "spoiled" stratum here is narrower than D1's.

specimen:
  source: series_file
  group_count: 5
  group_semantics_verified: false
  group_semantics_note: >
    FALSE, and it must stay false until the provider says more. The provider
    states "five beef cuts" and no derivation: not same-animal, not which
    primal, not whether the cuts are independent biological samples. The grouping
    is verifiable as a FILE grouping (five published series) and unverified as a
    biological one. Never write "five specimens" or "specimen-level" about D2
    without this flag in view.
  note: >
    PROVIDER-PUBLISHED grouping, not an assumption. One file per beef cut;
    `raw.glob_specimen_pattern` takes the file stem (TS1..TS5) as the specimen
    id. Five groups, five folds — LOSO(5) is exhaustive here rather than a
    convenience.

acquisition_campaigns:
  verified_on: "2026-09-20"
  source: "the provider's v3 record, restated in DATA-17"
  separation_note: >
    TS1 is about 2.5 years earlier than TS2..TS5. TS2..TS5 are one nine-day
    campaign. LOSO(5) changes cut and campaign together.
  groups:
    TS1: {start: "2016-05-12", end: "2016-05-13", campaign: 1}
    TS2: {start: "2018-10-08", end: "2018-10-09", campaign: 2}
    TS3: {start: "2018-10-11", end: "2018-10-12", campaign: 2}
    TS4: {start: "2018-10-13", end: "2018-10-14", campaign: 2}
    TS5: {start: "2018-10-15", end: "2018-10-16", campaign: 2}
  required_decomposition:
    status: mandatory
    items:
      - "leave-TS1-out (the 2016 campaign held out)"
      - "leave-{TS2..TS5}-out (each 2018 group held out in turn)"
    rule: >
      The two are reported as different quantities and never pooled into one
      cross-cut number. If they disagree in sign, the disagreement is reported
      as the campaign confound becoming visible and the cross-cut claim is
      withdrawn.

sessions:
  source: per_file
  note: >
    Each file is one uninterrupted 2160-minute acquisition, so the session and
    the specimen coincide. Recorded explicitly so that a later multi-session
    dataset cannot inherit the wrong boundary rule by default.

features:
  columns:
    - MQ2
    - MQ3
    - MQ4
    - MQ5
    - MQ6
    - MQ8
    - MQ9
    - MQ135
    - MQ136
    - temperature
    - humidity

tasks: [classification, regression]

preprocessing_overrides: {}

split:
  strategy: loso
  n_splits: 5
  protocol_compliant: true

notes: >
  The v3 files carry nine MQ channels; there is no MQ7 and no MQ137, and the
  channel set is not identical to D1's. The cross-dataset channel intersection
  is {MQ3, MQ5, MQ135, temperature, humidity} — five channels, measured from the
  acquired files' own headers, and recorded in the protocol so that a cross-food
  comparison is described on a matched subset when one is claimed. An earlier
  revision of this file listed eight channels including MQ2 and MQ4, neither of
  which D3 has; that list was wrong and is corrected here. D2's MQ136 is also
  absent from D3. Version 1 of this DOI — the single 4553-row file — is NOT used
  by this project; its SHA-256 remains recorded in the v1 manifest for audit
  purposes only.
