# Synthetic e-nose fixture — SMOKE TEST ONLY.
#
# Generated by drososense.data.synthetic; not observed data. It exists to
# exercise the full pipeline (split -> scaler -> window -> model -> metric ->
# result record) deterministically and offline.
#
# This dataset DOES publish a real specimen column, which is exactly why it is
# the smoke-test vehicle: it is the only dataset in the repository on which a
# genuinely protocol-compliant specimen-level split can be demonstrated today.
#
# Every result produced from it is written with evidence_class
# synthetic_fixture and must never be tabulated beside real datasets.

dataset_id: synthetic_enose
display_name: "Synthetic e-nose fixture (SMOKE TEST ONLY)"
role: "pipeline smoke test"
synthetic: true

source:
  url: "generated locally by drososense.data.synthetic"
  version: "1"
  license: "n/a (generated)"
  citation: "n/a"

raw:
  file: synthetic_enose.csv
  strip_whitespace: true
  column_map:
    time_index: time_index
    freshness_class: freshness_class
    tvc: tvc
  features:
    - s1
    - s2
    - s3
    - s4
    - s5
    - s6
    - temperature
    - humidity
  class_label_map:
    "0": 0
    "1": 1
    "2": 2
    "3": 3

labels:
  class_names: [Excellent, Good, Acceptable, Spoiled]
  derivation: "np.digitize of the simulated log10(TVC) at 3/4/5"

specimen:
  source: column
  column: specimen_id
  note: "Genuine generated specimen ids (sp000..spNNN). Protocol-compliant by construction."

features:
  columns:
    - s1
    - s2
    - s3
    - s4
    - s5
    - s6
    - temperature
    - humidity

tasks: [classification, regression]

preprocessing_overrides: {}
