# D3 — Rainbow Trout. Cross-food validation.
#
# STATUS: ACQUIRED. 210 sensor CSVs extracted from the published archive by HTTP
# range requests (see data/manifests/d3_rainbow_trout.yaml). The schema below is
# MEASURED from those files, not expected: all 210 share one header, and the
# column names, label vocabulary and per-file row counts were read off the
# archive rather than inferred from its description.
#
# ---------------------------------------------------------------------------
# WHAT THE ARCHIVE ACTUALLY CONTAINS
#
# Every file is `<YYYYMMDD><specimen>.csv` with header
#   MQ3, MQ5, MQ9, MQ135, MQ137, Temperature(°C), Humidity(%), TVC( log CFU/g), Label
# and 54–121 rows of one acquisition session. There is no time column — rows are
# a bare sequence — so `time_index` is synthesised as the row's position inside
# its own file.
#
# `Label` is BINARY: Fresh / Spoiled, and it is constant within a file. The
# provider's own split puts days 1–5 (TVC 4.16 … 6.08) at Fresh and days 6–7
# (TVC 7.75, 7.86) at Spoiled.
#
# `TVC` is constant within a file and takes exactly seven values, one per storage
# day. That is why the free-text `TVC( log CFU/g)` column is the regression
# target AND the source of the four-level class below.
#
# THE FOUR-LEVEL LABEL IS OURS, NOT THE PROVIDER'S. Under the beef thresholds
# (3/4/5 log10 CFU/g) the whole trout archive collapses to two classes, because
# its TVC range never goes below 2.23 or above 7.86 and clusters in 4.16–7.86.
# The project needs four classes for the cross-dataset macro-F1 comparison to be
# a like-for-like quantity, so protocol v1.1 froze trout-specific thresholds
# (4.3 / 5.0 / 6.5) BEFORE any D3 model was run. Both facts are recorded here:
# the derivation, and the collapse that motivated it.
#
# ---------------------------------------------------------------------------
# THE SPECIMEN GROUPING
#
# 210 files over 62 specimens. The token after the date (`F1F1`, `F2F14`, …) is
# the fillet; the same token reappears on several days with a strictly larger TVC
# each time, which is what makes it a repeated-measures panel of fillets rather
# than 210 one-off measurements. `split_unit: specimen` is therefore satisfied
# and LOSO/GroupKFold over the fillets is a real specimen-level split.
#
# 62, NOT 63. There are 63 distinct tokens in the raw filenames, and two of them
# are typos that `raw.specimen_aliases` (below) folds onto a real fillet, so the
# dataset has 62 specimens. The raw-token count is recorded separately below so
# the two numbers cannot be confused again.
#
# Two files carry a typo in their names. `raw.specimen_aliases` records each one
# with the evidence for the identity claim, and the loader refuses to start if an
# alias names a file that is not present, so the claim cannot quietly rot.
# ---------------------------------------------------------------------------

dataset_id: d3_rainbow_trout
display_name: "Rainbow Trout (e-nose + TVC)"
role: "cross-food validation"

schema_verified: true
schema_verified_on: "2026-09-20"
schema_verification_note: >
  Measured on the 210 extracted CSVs: one distinct header across all of them,
  25,080 rows in total, 62 specimens (from 63 raw filename tokens, two of which
  are aliased), zero missing values, `TVC` with exactly seven distinct values
  and `Label` constant within every file.

source:
  url: "https://zenodo.org/records/20649184"
  doi: "10.5281/zenodo.20649184"
  version: "v1"
  license: "CC BY 4.0"
  citation: >
    Bolaños Ledezma, Mauricio; Peluffo-Ordóñez, Diego Hernán; Arciniegas Herrera,
    Jose Luis; Guachi Guachi, Lorena de los Angeles (2026). A multimodal dataset
    of images, gas sensor responses, and microbiological measurements for
    assessing the freshness of rainbow trout fillets. Zenodo.
    doi:10.5281/zenodo.20649184

raw:
  glob: "*.csv"
  glob_specimen_pattern: '^(?P<date>\d+)(?P<specimen>F\d+F\d+M?)\.csv$'
  specimen_aliases:
    "202600515F1F1.csv":
      specimen: "F1F1"
      reason: >
        The date field carries nine digits ('202600515' where every other file
        has eight). Its TVC is 7.86, which is the day-7 value, and day 7 is
        2026-05-15; the intended stem is therefore 20260515F1F1. Treating the
        token separately would place one fillet's day-7 session in a different
        specimen from its day-1 and day-2 sessions, i.e. it would put two
        sessions of the same physical fillet into different splits.
    "20260513F4F1M.csv":
      specimen: "F4F1"
      reason: >
        The token carries a trailing 'M' that no other sensor file has. F4F1 has
        sessions on 05-09 (TVC 4.16), 05-12 (5.56), 05-14 (7.75) and 05-15
        (7.86) and none on 05-13; this file's date is 2026-05-13 and its TVC is
        6.08, the day-5 value. Including it makes F4F1's TVC sequence strictly
        increasing with date, which is the pattern every other fillet shows.
  strip_whitespace: true
  column_map:
    time_index: "@row_index"
    freshness_class: Label
    tvc: "TVC( log CFU/g)"
  features:
    - MQ3
    - MQ5
    - MQ9
    - MQ135
    - MQ137
    - temperature
    - humidity
  feature_map:
    MQ3: "MQ3"
    MQ5: "MQ5"
    MQ9: "MQ9"
    MQ135: "MQ135"
    MQ137: "MQ137"
    temperature: "Temperature(°C)"
    humidity: "Humidity(%)"
  class_label_map:
    fresh: 0
    spoiled: 3
  class_thresholds:
    thresholds: [4.3, 5.0, 6.5]
    names: [Excellent, Good, Acceptable, Spoiled]
    use_provider_labels: false
    rationale: >
      The provider labels are binary (Fresh/Spoiled) and the beef thresholds
      3/4/5 collapse the whole archive to two classes. These four thresholds
      partition the archive's own seven TVC values (4.16, 4.46, 5.48, 5.56,
      6.08, 7.75, 7.86) into four non-empty strata and were frozen in protocol
      v1.1 before any D3 model was run. The provider's binary Label is retained
      in the manifest and is reported alongside as a secondary agreement check.

labels:
  class_names: [Excellent, Good, Acceptable, Spoiled]
  naming_caveat: >
    NOT PROVIDER-STATED NAMES. The provider publishes only Fresh/Spoiled; the
    four names above are the project's labels for four TVC strata. They must not
    be cited as the dataset's own freshness classes.
  native_labels_present: [Fresh, Spoiled]
  derivation: >
    np.digitize(tvc, [4.3, 5.0, 6.5]) — see raw.class_thresholds. Under the beef
    thresholds 3/4/5 the same column would yield only two classes (TVC < 5 and
    TVC >= 5), which is recorded here because it is the reason the thresholds are
    dataset-specific.
  independence_caveat: >
    As with the beef datasets the class is a threshold of TVC, so classification
    and regression are two views of one variable and are never presented as
    independent evidence.

specimen_count: 62
raw_filename_tokens: 63
specimen_count_note: >
  62 specimens come from 63 raw filename tokens: `raw.specimen_aliases` folds two
  typo'd tokens onto real fillets. Counting the glob directly gives 63 and is the
  count this file used to state; the loader's own raw records give 62
  (n_train + n_test + val per fold sums to 62). 62 is the specimen count.

# ---------------------------------------------------------------------------
# THE ENDPOINT STRATUM (review item H2)
# ---------------------------------------------------------------------------
# D3's ground truth is not continuous and not row-level. `TVC` is constant within
# a file and takes exactly seven values, one per storage day
# (4.16, 4.46, 5.48, 5.56, 6.08, 7.75, 7.86), and the four-level label is a
# deterministic function of which of the seven a row carries. The 25,080 rows are
# therefore highly repeated in the supervised sense, and the endpoint degrees of
# freedom cannot exceed 7 whatever the row count says.
#
# `day` is a leakage and session boundary AND the endpoint stratum. Any n, df,
# confidence interval or bootstrap resampling unit reported on D3 must state how
# it relates to those seven levels; an n counted over rows, windows or sessions
# is not an endpoint sample size.
label_stratum:
  column: day
  n_levels: 7
  df_cap: 7
  derivation: "one storage day per distinct TVC value; the level is the value's day"
  obligation: >
    Report the relation to the seven day levels for any D3 n / df / CI / bootstrap
    resampling unit. This is declared now, before M4, because nothing in protocol
    v1.1 would have stopped a row-count n from being introduced.

specimen:
  source: series_file
  note: >
    PROVIDER-PUBLISHED grouping. The fillet token in the filename is the
    specimen; 62 of them, each measured on 1–7 storage days. Windows are built
    inside a single (fillet, session) so that a window can never mix two storage
    days, which would combine channels from one occasion with a label from
    another.

sessions:
  source: per_file
  note: >
    One file is one acquisition session. This is what keeps a sliding window
    inside a single storage day even where a fillet is measured across seven of
    them.

features:
  columns:
    - MQ3
    - MQ5
    - MQ9
    - MQ135
    - MQ137
    - temperature
    - humidity

tasks: [classification, regression]

preprocessing_overrides: {}

split:
  strategy: group_kfold
  n_splits: 5
  protocol_compliant: true

phase1_scope: "gas sensors + temperature + humidity + TVC only; images are out of scope"

notes: >
  21.1 GB archive, 1.04 MB of which is the sensor tables. The archive is never
  downloaded whole; members are read by HTTP range request and each extracted
  file's SHA-256 is recorded in data/manifests/d3_rainbow_trout.yaml. The
  publisher's md5 for the whole archive is NOT verified, because verifying it
  would require the 21.1 GB download this approach exists to avoid — that
  limitation is stated rather than glossed (see `integrity` in the manifest).
