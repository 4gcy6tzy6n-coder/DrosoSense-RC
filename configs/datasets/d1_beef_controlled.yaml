# D1 — Beef-Controlled. Primary food task.
#
# Binding (R0 rework, DATA-16): D1 = 10.17632/n8mc3nspfn.1.
# The provider's own title is "e nose based Beef Quality Classification
# Dataset(4classes)" (Mendeley Data, 2025). The previous revision of this file
# had D1 and D2 bound to each other's DOIs; that is corrected here and the
# official titles are what the correction rests on — mwmhh766fc is the one whose
# title says "under an uncontrolled environment", and it is now D2.
#
# Acquisition is automated by scripts/download_data.py, which verifies the
# published SHA-256 on download.
#
# ---------------------------------------------------------------------------
# PROTOCOL DEVIATION — read before using any number produced from this config.
#
# The published CSV contains NO specimen identifier. `sl no` runs 1..20815 and
# `minutes` 1..1735, both strictly increasing with zero resets, so the file is
# one continuous acquisition session rather than a concatenation of independent
# samples. A specimen-level split — the red line of the protocol — therefore
# CANNOT be built from the published data as-is.
#
# `specimen.source: time_block` below cuts the series into contiguous blocks of
# 150 distinct minutes and treats each block as a stand-in grouping. This is a
# documented assumption, NOT a published specimen id. Any result produced with it
# is flagged `protocol_compliant: false` in its run record and may not be
# reported as a protocol result. See data/manifests/d1_beef_controlled.yaml for
# the steps that would remove the blocker.
#
# D1 therefore contributes to Gate A only as an explicitly non-compliant
# secondary benchmark; the compliant gates are evaluated on the datasets that do
# satisfy `split_unit: specimen` (D2 and, subject to its own note, D3).
# ---------------------------------------------------------------------------

dataset_id: d1_beef_controlled
display_name: "Beef-Controlled (e-nose)"
role: "primary food task"

source:
  url: "https://data.mendeley.com/datasets/n8mc3nspfn/1"
  doi: "10.17632/n8mc3nspfn.1"
  version: "1"
  license: "CC BY 4.0"
  citation: >
    e nose based Beef Quality Classification Dataset(4classes). Mendeley Data,
    V1. doi:10.17632/n8mc3nspfn.1

raw:
  file: d1_beef_controlled.csv
  strip_whitespace: true
  column_map:
    time_index: minutes
    freshness_class: class
    tvc: tvc
  features:
    - MQ2
    - MQ3
    - MQ4
    - MQ5
    - MQ135
    - MQ136
    - MQ137
    - MQ138
    - temperature
    - humidity
  feature_map:
    MQ2: "Mq-2"
    MQ3: "Mq-3"
    MQ4: "Mq-4"
    MQ5: "Mq-5"
    MQ135: "Mq-135"
    MQ136: "Mq-136"
    MQ137: "Mq-137"
    MQ138: "Mq-138"
    temperature: "Temperature"
    humidity: "Humidity"
  class_label_map:
    "1": 0
    "2": 1
    "3": 2
    "4": 3

labels:
  class_names: [Excellent, Good, Acceptable, Spoiled]
  naming_caveat: >
    NOT PROVIDER-STATED NAMES. The provider publishes four integer classes 1..4
    and no names. The four names above are the project's labels for the four TVC
    strata, derived from the pre-frozen thresholds 3 / 4 / 5 log10 CFU/g. They
    are the same strata D2's provider names in words, which is what makes the two
    datasets comparable, but they must not be cited as D1's own label names.
  derivation: >
    Provider integer class and the project's TVC-threshold discretisation agree
    row-for-row and were checked to do so: class 1 tvc in [2.002, 2.9875],
    class 2 [3.0924, 3.9993], class 3 [4.0265, 4.9971], class 4 [5.100, 6.314],
    i.e. exactly np.digitize(tvc, [3, 4, 5]). Classification is therefore a
    discretisation of the regression target, not an independent label source.
  independence_caveat: >
    Because the class is a threshold of TVC, macro-F1 is a discretised view of
    regression error. Results must be reported together and never presented as
    two independent sources of evidence.

specimen:
  source: time_block
  block_by: time
  block_size: 150
  note: >
    ASSUMED, not published. 150 consecutive distinct `minutes` values per block
    (~12 rows each at the observed sampling rate), yielding ~12 blocks across the
    1735 distinct minutes. Chosen to be long enough to hold a 64-timestep window
    and to give enough blocks for a 5-fold split with a rotating validation
    block. It is a modelling assumption and does not correspond to a real
    independent sample.

sessions:
  source: specimen
  note: >
    One contiguous acquisition; the time-block stand-in doubles as the session
    boundary, so no window straddles a block edge.

features:
  columns:
    - MQ2
    - MQ3
    - MQ4
    - MQ5
    - MQ135
    - MQ136
    - MQ137
    - MQ138
    - temperature
    - humidity

tasks: [classification, regression]

preprocessing_overrides: {}

split:
  strategy: time_block_holdout
  n_splits: 5
  protocol_compliant: false

notes: >
  The four classes occupy contiguous stretches of the single session
  (transitions at rows 2939, 5207, 7499), which is consistent with the class
  being assigned by elapsed storage time rather than by independent sample. Any
  temporal split of this file is therefore between storage ages, not between
  samples, and is reported as such. 64% of rows are class 4.
