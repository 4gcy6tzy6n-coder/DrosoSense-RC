# =============================================================================
# AMENDMENT RECORD — v1.2 -> v1.4
# =============================================================================
amendment_v1_4:
  trigger: >
    During M4 (E1_main on d3_rainbow_trout), the four sequence baselines
    (``gru``, ``lstm``, ``cnn1d``, ``tcn``) crashed on every fold with
    ``Expected a 'cpu' device type for generator but found 'cuda'``: 4 models
    x ~310 (seed, fold, task) pairs = 1240 individual records per model,
    none with ``status == "ok"`` and every one with a fully populated
    ``test_fingerprint``. The runner registered every loaded record with a
    fingerprint into the prior-touches map, regardless of status, so once the
    device fix landed a clean re-run of the same (model, task, seed, fold)
    units was refused as ``test_touched_once violated: ... under config
    <prior>, re-evaluated under <new> ... protocol v1.1 §17 forbids re-fitting
    on a test split already touched``. None of those ~4,960 records had in
    fact scored the test split — they had crashed before any scoring
    happened. The freeze report
    ``results/tables/m1_real_validation_test_touched_once.json`` (which
    itself filters on ``status == "ok"``) showed 0 violations on the M1
    rows. The pre-run guard was therefore stricter than §17's text: it
    counted never-scored units as scored.
  not_driven_by_test_observations: >
    THIS AMENDMENT IS NOT DRIVEN BY ANY OBSERVED TEST RESULT. The four
    sequence baselines produced zero ``status == "ok"`` records on d3 —
    their metric values on the test split are not in this repository,
    their scores were not inspected, and no decision in this amendment
    uses any number produced by them. The only number inspected was the
    runner's own RuntimeError (a violation from the pre-run guard, not a
    metric), plus the device-level error from pytorch's randperm.
    The choice to scope "test evaluation" = "an evaluation that scored the
    split" is read off §17's definition ("the act of scoring a model on
    that split"), not off any specific number those crashed runs would
    have produced if they had not crashed.
  changed:
    - "§17 `hyperparameter_selection.test_touched_once`: implementation clarification — a run only registers its `(dataset, model, task, seed, fold)` fingerprint when it actually scored the split (`status = \"ok\"`). A crashed/errored run is recorded (status + reason + full config) but does not occupy the quota. The protocol text of §17 is unchanged."
    - "`drososense/evaluation/runner.py:283` (load-prior-touches loop): the prior registry now filters `prior.status == \"ok\"`, mirroring `test_touched_once_report`. The error message names protocol v1.4 (was v1.1) for a clearer audit trail."
    - "`PROTOCOL_VERSION` constant in `drososense/__init__.py` and `drososense/evaluation/runner.py`: bumped from `\"1.1.0\"` to `\"1.4.0\"` so that new runs produced under the fixed behaviour carry a version label distinguishable from the previously-failed (pre-fix) v1.1.0-labelled rows."
    - "`freeze_evidence.previous_version`: now points to v1.2.0 with its sha256 (`32c57f6e…`), keeping the move-forward record intact."
    - "`amendment_v1_4`: this block."
  unchanged:
    - "Every scientific claim, the contrast list, the hypotheses, the equivalence margins, the multiplicity families and their unit of correction, the model zoo, the preprocessing rules, the robustness protocol (eval_only injection stage, retrain_readout: false, drift placement), the size study, the stopping rules, the failure handling rules, the excluded specimen criteria, the compute degradation order, the narrative adjustment rules N1..N5, the scope-boundary claims-allowed/forbidden lists, the dataset bindings and DOIs, the channel intersection, the experiments register (E1..E12 + M1_benchmark)."
    - "The seed set (`root_seeds: [0..9]`), the seed-stratification bootstrap, the `split_unit`, the `forbidden` list, the anti-tuning rules, the AUROC empty-class policy, the macro-F1 empty-class policy, the small-p reporting rule, the primary and secondary metric declarations and their directions, alpha = 0.05, the cluster-level sign test as the decisive test, the pair-level Wilcoxon as descriptive, the effect-size binding on task, the multiplicity correction (holm) and its family rule."
    - "The values of `metrics`, `direction`, `α`, the `Gate_A/B/C` expressions, the `contrasts`, the `model_zoo`, the `robustness_protocol`, the `seed_strategy`, the `narrative_adjustment_rules` and the family_rule for multiplicity correction."
    - "D1's split / protocol_compliant: false flag; D2's LOSO(5) (and its leave-TS1-out decomposition); D3's split as declared by the active protocol at run time."
  runs_affected: >
    The fix RETROACTIVELY UNBLOCKS the following previously-failed records,
    so they may be re-run under v1.4 without violating §17:
    - d3_rainbow_trout, models {gru, lstm, cnn1d, tcn}, every (seed, fold)
      pair under the active protocol's split, where the previous record
      carries status != "ok". Concretely: ~4,960 records (4 models x 310
      folds across the seed x fold grid x 2 tasks), held under the
      ``protocol_compliant: true`` group, all of which produced a device
      error before any scoring happened.
    - The fingerprint records at fault are detected by reading
      ``prior.status == \"ok\"`` out of every loaded record — the ones
      that fail that filter are the affected ones; this is what the
      new hardening test pin as a regression.
    These rows are NOT re-run, re-interpreted, or merged with v1.4 re-runs
    here. The records stay labelled ``protocol_version = 1.1.0`` on disk
    in ``results/raw``; any new re-run under v1.4 will land at
    ``results/raw/e1_main_d3/d3_rainbow_trout/<model>/classification_seed<NN>_fold<NN>.json``
    with ``protocol_version = 1.4.0`` and is a separate record from the
    failed one. The independent review (Experimental Statistician) must
    PASS before the re-run starts; the four sequence baselines remain
    un-re-run under v1.4 until that review passes.
  integrity_disclosures:
    rule: >
      The amendment rule requires that the trigger, the change and the
      already-completed runs are stated. This block records the integrity
      disclosures the change carries, in addition to the
      `changed` / `unchanged` / `runs_affected` summary above, because
      the change unblocks a re-run.
    v1_1_v1_2_failed_records_preserved:
      rule: >
        v1.1 / v1.2 failed D3 rows (status != \"ok\", 4 models, ~310
        (seed, fold) pairs each, 2 tasks) stay on disk under their
        original ``protocol_version = 1.1.0`` label and under their
        original config_hash. None is mutated in place; the
        ``failure_reason`` field (e.g. the device-error string) is left
        intact as a record of why the row was created under that version.
      rationale: >
        Editing the failed rows to clear their fingerprint would (a)
        rewrite a stored history entry, which the freeze rule prohibits
        for completed rows, and (b) lose the audit trail that the
        device-fix happened. The re-run under v1.4 lands as a new
        record, not as an edit, and the version label distinguishes the
        two.
    v1_4_active_protocol_choice:
      rule: >
        The active protocol file remains ``configs/protocol_v1.2.yaml``
        after this commit. v1.4 is added as a frozen sibling with its own
        sha256 sidecar (``configs/protocol_v1.4.sha256``) — it is NOT
        promoted to the active. The active protocol is switched only by
        a separate commit, after the project owner rules on it.
      rationale: >
        This amendment changes a §17 implementation clarification, not
        any declared metric / direction / contrast / gate / hypothesis /
        multiplicity family. Promoting v1.4 to the active would also
        require the substantive protocol to be restated, which is
        outside the scope of DATA-41. The next-version switch happens
        in DATA-25/DATA-31-style follow-up PRs.
    experimental_statistician_review:
      rule: >
        No re-run of the four sequence baselines on d3 starts until the
        Experimental Statistician's independent review of this fix
        records PASS on the DATA-41 thread (or on the issue that names
        the review). The review checks: (a) the §17 text-vs-
        implementation alignment, (b) the chosen status-filter semantics,
        (c) the absence of any observed-test-result reasoning in the
        trigger, (d) the byte-frozen state of v1.1 and v1.2, (e) the
        ``amendment_v1_4`` content.
      owner_note: >
        The review task is already issued as a separate issue on the
        DrosoSense-RC project. This amendment assumes review PASS;
        re-runs that start before review PASS are out of scope and
        prohibited.
