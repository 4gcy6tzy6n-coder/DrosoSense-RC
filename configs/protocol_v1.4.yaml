# =============================================================================
# DrosoSense-RC — FROZEN PROTOCOL AMENDMENT v1.4
# =============================================================================
# Project : DrosoSense-RC (Drosophila Sensory Connectome Reservoir Computing)
# Version : 1.4.0
# Frozen  : 2026-09-21T05:30:00Z
# Owner   : DATA-41 (clarification of §17 enforcement after device crashes)
# Supersedes: v1.2.0 (configs/protocol_v1.2.yaml, kept unchanged on disk)
#
# WHY THIS FILE EXISTS. §17 of v1.1 / v1.2 defines a test evaluation as the
# act of scoring a model on the test split, and forbids re-fitting on a test
# split that has already been scored. The freeze test in
# ``drososense/evaluation/results.py:test_touched_once_report`` reads that
# faithfully — it counts only records with ``status == "ok"``.
#
# The runner, however, registered every loaded record whose ``test_fingerprint``
# was set, regardless of status. A crashed run is recorded with its full config
# fingerprint and an empty ``metrics`` block, but it never scored the split. The
# implementation was therefore stricter than §17's text — a run that crashed
# before scoring occupied the (dataset, model, task, seed, fold) quota, and a
# later re-run after the crash was refused as a "second touch".
#
# During M4 the four sequence baselines (``gru``, ``lstm``, ``cnn1d``, ``tcn``)
# on ``d3_rainbow_trout`` were run on the wrong device and crashed with
# ``Expected a 'cpu' device type for generator but found 'cuda'`` on every one
# of the 1240 folds per model (4 models x 31 folds per seed across the 31 seed
# x fold combinations produced under ``GroupKFold(5)`` x ``root_seeds``). No
# record carried ``status == "ok"``. Once the device fix landed, the runner
# refused every (model, task, seed, fold) in that block as a previously-touched
# test split, even though no test split had in fact been scored.
#
# §17's text says "A test evaluation is the act of scoring a model on that
# split." A crashed run never scored anything; counting it as a touch is the
# implementation deviating from the protocol's own definition. v1.4 narrows
# the implementation back onto the text: only ``status == "ok"`` records
# register a fingerprint into the prior-touches map. Re-runs after a crash
# are not a re-touch.
#
# Every other field of v1.2 is unchanged. The contrast list, the hypotheses,
# the equivalence margins, the multiplicity families and their unit of
# correction (a ``(contrast, condition)`` pair), the model zoo, the
# preprocessing rules, the robustness protocol (``eval_only`` injection
# stage, ``retrain_readout: false``, drift placement), the size study, the
# seed set and the seed-stratification bootstrap, the split unit, the
# ``forbidden`` list, the anti-tuning rules, the AUROC empty-class policy,
# the macro-F1 empty-class policy, the small-p reporting rule, the primary
# and secondary metric declarations and their directions, alpha = 0.05, the
# cluster-level sign test as the decisive test, the pair-level Wilcoxon as
# descriptive, the effect-size binding on task, the multiplicity correction
# (holm) and its family rule, the narrative adjustment rules N1..N5, the
# per-dataset protocol_compliant flags, the dataset DOIs and bindings, the
# channel intersection, the experiments register (E1..E12 + M1_benchmark)
# — none of these move.
#
# v1.1 and v1.2 stay on disk unchanged, with their sidecars still matching,
# so the numbers produced under them remain attributable to the text that
# produced them. Runs completed under v1.1 and v1.2 stay labelled
# ``protocol_version = 1.1.0`` / ``1.2.0`` and are not re-interpreted here.
# New runs produced under v1.4 carry ``protocol_version = 1.4.0``; their
# status field is honoured by the runner, so a crash produces no
# ``test_fingerprint`` registration. The fix is implementation-level only and
# does not change any declared metric, contrast, gate expression, hypothesis,
# multiplicity family, model zoo item, robustness rule, preprocessing rule or
# narrative rule.
#
# AMENDMENT RECORD: the trigger, the change, which already-completed runs are
# affected, and the integrity disclosures this amendment carries are stated in
# ``amendment_v1_4`` at the end of this file.
# =============================================================================

