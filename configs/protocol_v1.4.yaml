# -----------------------------------------------------------------------------
# 17. HYPERPARAMETER SELECTION AND TEST ISOLATION  — implementation clarification
# -----------------------------------------------------------------------------
# §17's definition is unchanged:
#
#   A test evaluation is the act of scoring a model on that split. Re-scoring
#   saved predictions for a different metric is not a new touch; re-running
#   the model with different hyperparameters is, and is forbidden.
#
# What v1.4 narrows is the IMPLEMENTATION of this definition in the runner:
# only a run that scored the split (``status == "ok"``) occupies the
# (dataset, model, task, seed, fold) quota. A run that crashed before any
# scoring happened is recorded with status="failed" and a failure_reason,
# carries the full config fingerprint (so the fix can be re-derived), but
# does NOT register its test_fingerprint in the prior-touches map. A later
# re-run of the same (dataset, model, task, seed, fold) is therefore not a
# re-touch and is permitted (provided the new run uses the same or a
# different config — the §17 violation only applies when the new config_hash
# differs from a recorded ok run's config_hash). The existing
# ``test_touched_once_report`` in drososense/evaluation/results.py already
# applies the same status filter to the post-hoc report; v1.4 brings the
# PRE-run check in line with it.
#
# The hardening test in tests/test_test_touched_once_registration.py pins
# both directions: a crashed run does not register; an ok run does register
# and is refused when re-run with a different config_hash (re-computation
# with the same config_hash remains allowed and is reported, not refused).
hyperparameter_selection:
  test_touched_once:
    enabled: true
    definition: >
      For each (dataset, seed, fold) the test split is evaluated exactly once
      per (model, task). A test evaluation is the act of scoring a model on
      that split. Re-scoring the saved predictions for a different metric is
      not a new touch; re-running the model with different hyperparameters
      is, and is forbidden.
    scoring_required: >
      A run only counts as a "touch" when it actually scored the split.
      A run that crashed before scoring carries ``status = "failed"`` and is
      recorded for completeness (failure handling per §20), but its
      ``test_fingerprint`` is not registered and a later re-run of the same
      (dataset, model, task, seed, fold) is not a re-touch.
    enforcement: >
      The runner records a test fingerprint per (dataset, seed, fold, model,
      task); a second record with the same fingerprint and the SAME
      configuration hash is a re-computation and is allowed; a second record
      with the same fingerprint and a DIFFERENT configuration hash is a
      protocol violation and fails the run. A record with ``status != "ok"``
      does not register a fingerprint and therefore cannot be the source of a
      "second touch" violation.

