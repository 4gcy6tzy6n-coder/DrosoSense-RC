    A protocol amendment requires a new file configs/protocol_v{N+1}.yaml that
    keeps this file unchanged, states the trigger, the change, and which
    already-completed runs are re-run. Runs completed under v1.4 stay in
    results/raw and are labelled protocol_version = 1.4.0.

