# -----------------------------------------------------------------------------
# 24. R0 REWORK LOG  (what changed from v1, and why)
# -----------------------------------------------------------------------------
rework_log:
  - item: X1
    change: "D1 -> 10.17632/n8mc3nspfn.1 and D2 -> 10.17632/mwmhh766fc.3, following the providers' own titles."
  - item: X2
    change: "D2 moved from version 1 to version 3 (five cuts); split changed to LOSO(5) and now satisfies split_unit: specimen."
  - item: X4
    change: "D3 schema replaced with the measured header; 210 CSVs acquired by HTTP range request; four-level label derived at frozen trout thresholds and declared as derived."
  - item: X5
    change: "AUROC empty-class policy declared and implemented; auroc_n_classes_scored is either 4 or 0."
  - item: X6
    change: "Run counts restated as 18 per dataset and 36 in total; the earlier '36 runs each' overstated the coverage by a factor of two."
  - item: C1
    change: "Bootstrap resampling unit fixed to the fold; seeds declared a stratification and never resampled."
  - item: C2
    change: "Gates and narrative rules rewritten as evaluable boolean expressions with numeric equivalence margins."
  - item: C3
    change: "Freeze evidence added: RFC3339 timestamp, sidecar digest, and a data_contact_log that must remain empty."
  - item: H1
    change: "Multiplicity families enumerated; every test id belongs to exactly one family."
  - item: H2
    change: "Wilcoxon alternative/zero_method/correction/mode, bootstrap B/seed/ci_type and effect sizes all fixed."
  - item: H3
    change: "Hyperparameter grid, per-fold selection scope and test_touched_once declared."
  - item: H4
    change: "E3 test set fixed across fractions and sampling declared nested."
  - item: H5
    change: "Stopping rules, failure handling, frozen exclusion criteria and compute degradation order added."
  - item: H6
    change: "Robustness injection stage, retraining policy and drift placement declared."
  - item: M5
    change: "Size study sampling declared nested with a fixed seed policy."
  - item: M6
    change: "RNG hierarchy declared; matching requirements for a paired contrast enumerated."
  - item: R0.1-C1
    change: >
      Gate symbol namespace fixed: datasets resolve from the `datasets` block
      (short name and id both), not from the values a result table happens to
      contain. Unknown name and missing contrast are now separate, distinguishable
      failures.
  - item: R0.1-C2
    change: >
      The decisive test is now the exact two-sided sign test over cluster means
      (one mean per held-out block), and `sig` additionally requires
      `minimum_achievable_p_over_clusters <= alpha`. The pair-level Wilcoxon is
      retained as a descriptive column that no gate reads. Added while fixing
      this, and reported as an addition rather than as part of the review's
      finding: the bootstrap interval had the same defect and was moved to the
      same level — seeds are now averaged inside each cluster before the clusters
      are resampled, so the interval no longer narrows as seeds are added.
      Without that, Gate_A (decided entirely by `ci_contains_zero` and
      `noninferior`) would have remained openable by adding seeds.
  - item: R0.1-H1
    change: >
      D2's acquisition-campaign confound recorded; `group_semantics_verified: false`
      on D2; leave-TS1-out / leave-{TS2..TS5}-out decomposition made a mandatory
      E1 reporting item.
  - item: R0.1-H2
    change: >
      D3's seven endpoint levels, the df cap of 7 and the `label_stratum: day`
      declaration added, with the obligation to relate any D3 n/df/CI/resampling
      unit to those seven levels.
  - item: R0.1-H4
    change: >
      The freeze check reports the LIVE contact log beside the frozen placeholder
      field, and warns when the two disagree.
  - item: R0.1-M1
    change: >
      `n_specimens_tested` renamed to `n_specimen_evaluations`; a separate
      `n_distinct_specimens` reports the dataset property (D2 = 5, D3 = 62).
  - item: R0.1-M2
    change: >
      D3's specimen count stated consistently as 62, with the 63 raw filename
      tokens and the two aliases that reduce them recorded beside it.
  - item: R0.1-M3
    change: >
      Effect size keyed on TASK, not on the metric's spelling, so `r2` takes
      Hodges-Lehmann.
  - item: R0.1-M4
    change: >
      `equivalence_p` renamed `tost_proxy_p` and labelled a proxy; the cluster
      count behind an equivalence verdict is disclosed on the same line.
  - item: R0.1-M5
    change: >
      D1's `data_verified.specimens: 12` replaced with `specimens: null` plus the
      time-block surrogate actually in use.
  - item: R0.1-AUX
    change: >
      Channel intersection corrected to the measured 5 channels
      {MQ3, MQ5, MQ135, temperature, humidity}; per-dataset channel lists recorded.
  - item: R0.1-LOW
    change: >
      p-values below 1e-12 are published as "<1e-12" rather than as a float64
      cancellation artefact.

# -----------------------------------------------------------------------------
# 25. AMENDMENT RECORD — v1.1 -> v1.2  (what triggered it, what it changes)
# -----------------------------------------------------------------------------
amendment_v1_2:
  trigger: >
    The R0.1 statistical review of DATA-16 (recorded on DATA-18) reproduced the
    delivered v1.1 output exactly — 8/8 statistic rows, deltas, intervals and
    pair counts — and returned Gate B = FAIL with Gate A and Gate C CONDITIONAL,
    on the ground that the DECISION MACHINE could not be opened rather than that
    the numbers were wrong. Two CRITICAL defects were confirmed in the gate
    engine: the dataset symbol namespace never matched production, and `sig()`
    read a pseudoreplicated p-value.
  changed:
    - "§3: cluster-count rule, reachability note and per-dataset group/label semantics."
    - "§8: the bootstrap averages seeds inside each cluster before resampling clusters, so the interval is invariant to the seed count."
    - "§10: decisive test is the cluster-level exact sign test; the pair-level Wilcoxon is descriptive; effect size keyed on task; equivalence proxy named."
    - "§13: symbol namespace rule, significance-reachability term in `sig`, per-gate reachability declaration, availability rule for N5, and the model-id binding so `params(R0) < params(GRU)` is resolvable."
    - "§15: D2 campaign confound and group_semantics_verified; D3 endpoint df cap and label_stratum; channel intersection corrected."
    - "§16: `protocol_id: R4` recorded on the ESN so M4's records resolve the frozen expressions."
    - "§22: summary and aggregate schemas renamed and documented; small-p reporting rule."
    - "§23: D1 has no specimens; D3 endpoint levels and token reduction recorded."
  unchanged:
    - "Every scientific claim, the contrast list, the hypotheses, the equivalence margins, the multiplicity families, the model zoo, the preprocessing rules, the robustness protocol and the size study."
    - "The seed set, the split_unit, the `forbidden` list and the anti-tuning rules."
  runs_affected: >
    NONE ARE RE-RUN. No R0..R5 contrast exists yet, so no gate term has ever been
    evaluated against real evidence and nothing computed under v1.1 becomes
    invalid: the v1.1 rows in results/tables are the baseline comparisons, they
    remain labelled protocol_version = 1.1.0, and the re-analysis published with
    this amendment recomputes them under v1.2's decisive test so that both views
    are on the record. M4 begins under v1.2.
  open_decisions:
    - id: OD1
      question: >
        D2's five-cluster floor (0.0625) makes every `sig` term on D2 permanently
        unreachable. Raise D3's cluster count so the D3 terms are reachable
        (D3 has 62 specimens and n_splits = 5 today), or accept that Gate_B and
        Gate_C cannot be opened on this design and write the paper from the
        narrative-adjustment branches?
      arithmetic: >
        A cluster-level sign test needs at least 6 clusters for alpha = 0.05 to be
        attainable at all: 2/2^5 = 0.0625 > 0.05, 2/2^6 = 0.03125 <= 0.05.
      options:
        - "D3 n_splits 5 -> 10 (or LOSO(62)): no data cost, no completed run invalidated (no R0..R5 contrast exists), D3's sig terms become reachable."
        - "Leave the split as configured and accept Gate_B/Gate_C as unreachable; the narrative rules N1-N5 select the branch."
      decision_owner: "project owner (Mika) / Thinker at the R0.1 gate"
      not_taken_here: >
        Deliberately not decided in this amendment. Changing a split until a gate
        becomes reachable is choosing the design after knowing which way the gate
        leans, which is the failure mode this whole protocol exists to prevent.
      owner_note: "RAISED IN THE DATA-16 REPLY, NOT RESOLVED HERE"
