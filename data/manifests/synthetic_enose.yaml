#
# This manifest exists so the fixture travels through exactly the same
# manifest/loader/pipeline path as real data, and so that any result derived
# from it is unambiguously labelled as synthetic.

dataset_id: synthetic_enose
display_name: "Synthetic e-nose fixture (SMOKE TEST ONLY)"
status: auto
synthetic: true

license: "n/a (generated by this repository)"
license_url: ""
source_url: "generated locally by drososense.data.synthetic"
doi: ""
version: "1"

citation: "Generated by DrosoSense-RC. Not a scientific dataset. Do not cite."

files:
  - name: synthetic_enose.csv
    sha256: null
    size_bytes: null
    required: true
    download_url: null
    note: >
      Produced deterministically by `python scripts/make_fixture.py`. The SHA-256
      is deliberately not pinned: the fixture is regenerated from the seed in
      drososense.data.synthetic.FixtureSpec, and pinning a digest here would
      break the moment a fixture parameter changes. The generator's seed IS the
      integrity guarantee, and it is recorded in every run record.

schema_notes: >
  GENERATED, not observed. Columns: specimen_id, time_index, s1..s6,
  temperature, humidity, freshness_class, tvc. Each specimen has its own sensor
  offset (sd 6.0) and its own logistic spoilage trajectory in log10(TVC) from
  ~2.2-2.9 to ~6.0-8.5; freshness_class is np.digitize of tvc at 3/4/5, the same
  thresholds the beef datasets use. Default: 12 specimens x 120 timesteps.

specimen_note: >
  Genuine specimen identifiers exist by construction (sp000..spNNN), which is
  why this fixture is the only dataset in the repository on which a truly
  protocol-compliant specimen-level split can be demonstrated today.

notes: >
  The generator deliberately makes per-specimen sensor offsets large relative to
  measurement noise. This is what makes the fixture a useful leakage canary: a
  row-level split lets a model memorise per-specimen offsets and scores well above
  what a specimen-level split allows. tests/test_leakage.py uses that gap to
  demonstrate the audits have real detection power.

extra:
  generator: "drososense.data.synthetic.generate_fixture"
  default_seed: 20260920
  evidence_class: synthetic_fixture
