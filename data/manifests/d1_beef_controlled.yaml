schema_notes: >
  VERIFIED on the downloaded file: 20,815 rows x 14 columns after stripping
  trailing whitespace from headers —
  ['sl no', 'minutes', 'Temperature', 'Humidity', 'Mq-2', 'Mq-3', 'Mq-4',
  'Mq-5', 'Mq-135', 'Mq-136', 'Mq-137', 'Mq-138', 'class', 'tvc'].
  NOTE the ragged header whitespace ('Mq-2 ' etc.), which the loader strips.
  `sl no` is strictly increasing 1..20815 with zero resets; `minutes` is
  monotonic 1..1735 with 19,080 repeated values (~12 rows per minute).
  `class` in {1,2,3,4}; `tvc` in [2.002, 6.314].
  Verified that classes 1..4 partition `tvc` at 3/4/5: class 1 [2.002, 2.9875],
  class 2 [3.0924, 3.9993], class 3 [4.0265, 4.9971], class 4 [5.100, 6.314].
  Class balance: class 4 = 13,315 rows (64%), classes 1/2/3 = 2940/2268/2292.

label_provenance: >
  The provider publishes integer classes 1..4 and NO names. The four names the
  project uses (Excellent / Good / Acceptable / Spoiled) are its own labels for
  the four TVC strata at the thresholds 3 / 4 / 5 log10 CFU/g. They must not be
  cited as the dataset's own class names. See configs/datasets/d1_beef_controlled.yaml.

specimen_note: >
  NO SPECIMEN IDENTIFIER IS PUBLISHED. Both `sl no` and `minutes` are monotonic
  with zero resets, so the file is one continuous acquisition rather than a
  concatenation of independent samples, and there is no session-boundary column.
  Note that the four classes fall in contiguous stretches (transitions at rows
  2939, 5207 and 7499), consistent with the class tracking elapsed storage time
  rather than independent samples.

blockers:
  - "The published CSV contains no specimen identifier, so the protocol's
     split_unit: specimen cannot be satisfied. The project uses a documented
     time-block stand-in and flags every resulting run protocol_compliant: false."
  - "class is a threshold of tvc, so the classification task is a discretisation
     of the regression target rather than an independent label source."

manual_steps:
  - "Automated path (works, no account needed): python scripts/download_data.py --dataset d1_beef_controlled"
  - "Manual path: open https://data.mendeley.com/datasets/n8mc3nspfn/1, download 'Beef quality 4 classes.csv', and save it as data/raw/d1_beef_controlled/d1_beef_controlled.csv."
  - "To REMOVE the blocker, obtain per-sample provenance from the authors: an acquisition log recording which rows belong to which beef sample."
  - "Until then, D1 results are reported only under the explicitly non-compliant time-block split, or D1 is dropped from the protocol results and the paper says so."

