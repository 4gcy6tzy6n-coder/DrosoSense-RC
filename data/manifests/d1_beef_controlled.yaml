schema_notes: >
  VERIFIED on the downloaded file: 4553 rows x 15 columns —
  ['minute', 'class', 'TVC', 'MQ135', 'MQ136', 'MQ2', 'MQ3', 'MQ4', 'MQ5',
  'MQ6', 'MQ7', 'MQ8', 'MQ9', 'Humidity', 'Temperature'].
  `minute` is strictly increasing, 1..4553, 4553 unique values, zero resets.
  `class` in {excellent, good, acceptable, spoiled}; `TVC` in [2.567, 8.522].
  `class` is a deterministic threshold of `TVC` at 3.0 / 4.0 / 5.0 log10 CFU/g
  (verified by inspecting per-class TVC ranges).
  Class balance is heavily skewed: spoiled 3874, excellent 285, good 211,
  acceptable 183 rows (85% spoiled). Macro-F1 is the frozen primary metric
  precisely because it is not dominated by the majority class.

specimen_note: >
  NO SPECIMEN IDENTIFIER IS PUBLISHED. The file is one continuous 75.9-hour
  measurement. There is no column identifying the individual beef sample, no
  reset in the time axis, and no session boundary column.

blockers:
  - "The published CSV contains no specimen identifier, so the frozen protocol's
     split_unit: specimen cannot be satisfied. A row-level split would leak
     severely (adjacent rows one minute apart) and is forbidden by protocol v1."
  - "class is derived from TVC, so the classification task is a discretisation
     of the regression target rather than an independent label source."

