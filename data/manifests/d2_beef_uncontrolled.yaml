# D2 — Beef-Uncontrolled. Acquisition manifest.
#
# Bound to 10.17632/mwmhh766fc.3 by the R0 rework (DATA-16). The provider's own
# title is "Electronic nose dataset for beef quality monitoring under an
# uncontrolled environment" — which is what makes this DOI D2 and not D1.
#
# VERSION 3 is the revision this project uses. Version 1 is a single 4553-row
# file with no sample grouping; version 3 publishes the same measurements as five
# series, one per beef cut, so a specimen-level split becomes possible. The v1
# digest is retained at the bottom of this file for audit only — nothing in the
# project reads v1.
#
# Verified 2026-09-20 against the Mendeley public API and by checksum.

