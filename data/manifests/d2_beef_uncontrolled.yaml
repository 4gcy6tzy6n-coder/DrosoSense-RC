schema_notes: >
  VERIFIED on the extracted files: five CSVs, each 2160 rows (10,800 total),
  columns ['minute', 'class', 'TVC', 'MQ135', 'MQ136', 'MQ2', 'MQ3', 'MQ4',
  'MQ5', 'MQ6', 'MQ8', 'MQ9', ..., 'Humidity', 'Temperature'].
  `minute` is 1..2160 with 2160 unique values in every file, so each file is one
  continuous acquisition.
  COLUMN ORDER IS NOT UNIFORM: TS1 ends with (Humidity, Temperature) while
  TS2..TS5 end with (Temperature, Humidity). Every column is read BY NAME; no
  column is read by position anywhere in this project, and a unit test asserts it.
  `class` in {excellent, good, acceptable, spoiled} — provider-stated words.
  `TVC` in [2.233, 5.098] (whole dataset). Per-class TVC: excellent
  [2.233, 2.989], good [3.044, 3.847], acceptable [4.762, 5.000], spoiled
  [4.875, 5.098]. Class balance across the five files: excellent 1680,
  good 2820, acceptable 2100, spoiled 4200 rows.
  There is no MQ7 and no MQ137 in this dataset.

specimen_note: >
  SPECIMEN IDENTIFIER IS PUBLISHED, as the file itself. The provider states the
  five series correspond to five beef cuts, so `specimen.source: series_file`
  takes the file stem (TS1..TS5) as the specimen id. This is the provider's own
  grouping, not an assumption, which is why D2 satisfies split_unit: specimen
  under LOSO(5). Five specimens is few; the protocol records that the exact
  two-sided minimum p over five clusters is 0.0625, so D2 is reported as
  underpowered rather than as evidence of no effect.

