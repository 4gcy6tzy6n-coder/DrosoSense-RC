# D3 — Rainbow Trout. Acquisition manifest.
#
# STATUS: ACQUIRED. The R0 audit found that this dataset had been recorded as a
# resource blocker on the grounds that "the only artifact is a single 21.1 GB
# archive dominated by images". Both halves of that are true and neither is a
# blocker: the sensor tables are 210 CSV files totalling 1,092,874 bytes, and
# they can be read straight out of the archive with HTTP range requests. They
# have been, and the result is recorded in d3_sensor_files.yaml.
#
# ---------------------------------------------------------------------------
# WHAT THIS MANIFEST DOES *NOT* CLAIM
#
# The archive is never downloaded whole, so the publisher's md5 for
# dataset.zip CANNOT be verified. That is a real gap and it is stated rather than
# glossed. What is verified instead, on every acquisition:
#
#   * the CRC-32 the archive's own central directory declares for each member
#     (checked during extraction; a corrupted transfer cannot pass), and
#   * the SHA-256 of every extracted member, recorded in d3_sensor_files.yaml
#     and re-checked by `download_data.py --verify-only`.
#
# So the claim is about the 210 files this project actually uses, not about the
# archive as a whole.
# ---------------------------------------------------------------------------

