      when the members are extracted. The loader globs these files directly.

schema_notes: >
  VERIFIED by reading the extracted files, not inferred from the record
  description. All 210 share one header:
  'MQ3,MQ5,MQ9,MQ135,MQ137,Temperature(°C),Humidity(%),TVC( log CFU/g),Label',
  54-121 rows per file, 25,080 rows in total, zero missing values.
  There is NO time column: rows are a bare sequence, so the loader synthesises
  `time_index` as the row's position inside its own file.
  `TVC` is constant within a file and takes exactly seven values —
  {4.16, 4.46, 5.48, 5.56, 6.08, 7.75, 7.86} — one per storage day.
  `Label` is constant within a file and is BINARY: Fresh (150 files) or Spoiled
  (60 files), with the provider's boundary falling between TVC 6.08 and 7.75.
  The images (820 CR2 + 820 JPG) and the two .txt / one .py helper files in the
  archive are out of scope for phase 1 and are not extracted.

label_provenance: >
  The provider publishes only Fresh/Spoiled. The project needs four classes for
  the cross-dataset macro-F1 comparison to be a like-for-like quantity, and the
  beef thresholds (3/4/5 log10 CFU/g) collapse this archive to two classes
  because its TVC never goes below 2.23 and clusters in 4.16-7.86. Protocol
  v1.1 therefore froze trout-specific thresholds 4.3 / 5.0 / 6.5 BEFORE any D3
  model was run, giving four non-empty strata (3,479 / 3,601 / 10,800 / 7,200
  rows). The four names are the project's; they are not the dataset's own
  freshness classes.

specimen_note: >
  SPECIMEN IDENTIFIER IS PUBLISHED, in the filename. Each file is
  `<YYYYMMDD><fillet>.csv` with the fillet token `F<group><F><index>`; the token
  reappears across storage days with a strictly larger TVC each time, which is
  what makes this a repeated-measures panel of 63 fillets rather than 210 one-off
  measurements. 62 distinct specimen ids result after the two filename aliases
  recorded in configs/datasets/d3_rainbow_trout.yaml are applied. A session is
  one file, so a fillet measured on seven days has seven sessions and no window
  straddles a day boundary.

files_skipped:
  - "820 .CR2 raw images and 820 .JPG images — phase 1 uses sensor channels only"
  - "dataset/tvc.txt — a list of third-party certificate links, not a data source"
  - "dataset/day6/raw/listado_fechas.txt — capture timestamps for the image files"
  - "dataset/raw_to_jpg.py — the authors' conversion helper"

blockers: []

manual_steps:
  - "Automated path: python scripts/download_data.py --dataset d3_rainbow_trout"
  - "The script lists the archive's central directory, extracts only the 210 members matching the glob, verifies each member's CRC-32 against the archive, and writes their SHA-256 into data/manifests/d3_sensor_files.yaml."
  - "It never downloads the whole archive. There is no --accept-large-download path for D3 any more; that flag was needed only while the archive was assumed to be the unit of acquisition."
  - "Re-verify at any time without touching the network beyond the central directory: python scripts/download_data.py --dataset d3_rainbow_trout --verify-only"

