[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
markers =
    unit: fast, hermetic tests of a single module
    integration: tests that exercise several modules or run a real model
    slow: long-running tests excluded from the default check
filterwarnings =
    error::DeprecationWarning:drososense.*
